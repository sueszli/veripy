[project]
name = "veripy"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["xdsl==0.63.0", "click==8.3.3"]

[tool.uv]
dev-dependencies = ["pytest==9.0.3", "lit==18.1.8", "filecheck==1.0.3"]

[project.scripts]
veripy = "veripy.main:cli"

[project.optional-dependencies]
regen = ["anthropic>=0.40.0"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
