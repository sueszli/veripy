[project]
name = "veripy"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["xdsl==0.63.0"]

[tool.uv]
dev-dependencies = ["lit==18.1.8", "filecheck==1.0.3"]

[project.scripts]
veripy = "veripy.main:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
