[project]
name = "veripy"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "xdsl==0.63.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==9.0.3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
